name: Static Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]

# 同一 ref 只保留最新一次运行（docker build 静态二进制很贵）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build static binary
      uses: docker/build-push-action@v4
      with:
        context: .
        file: Dockerfile.static
        platforms: linux/amd64
        push: false
        tags: trha:static
        outputs: type=local,dest=./dist
    
    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: trha-linux-x86_64
        path: dist/trha
    
    - name: Create release package
      if: github.event_name == 'release'
      run: |
        cd dist
        tar -czf trha-linux-x86_64.tar.gz trha
        sha256sum trha-linux-x86_64.tar.gz > trha-linux-x86_64.tar.gz.sha256
    
    - name: Upload release asset
      if: github.event_name == 'release'
      uses: actions/upload-release-asset@v1
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./dist/trha-linux-x86_64.tar.gz
        asset_name: trha-linux-x86_64.tar.gz
        asset_content_type: application/gzip
    
    - name: Upload checksum
      if: github.event_name == 'release'
      uses: actions/upload-release-asset@v1
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./dist/trha-linux-x86_64.tar.gz.sha256
        asset_name: trha-linux-x86_64.tar.gz.sha256
        asset_content_type: text/plain
  
  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        distro: [ubuntu, centos, debian]
    
    steps:
    - name: Download binary
      uses: actions/download-artifact@v4
      with:
        name: trha-linux-x86_64
    
    - name: Make binary executable
      run: chmod +x trha
    
    - name: Test on ${{ matrix.distro }}
      uses: docker://${{ matrix.distro }}:latest
      with:
        args: |
          bash -c "
            ./trha --version
            ./trha --help
            echo 'Binary works on ${{ matrix.distro }}'
          "
    
    - name: Test basic functionality
      run: |
        ./trha --version
        ./trha --help
        echo "Binary works on host system"