name: CI

# ⚠️ 本工作流**未在本机实跑过**（本机跑的是等价的 shell 命令，回执见
#    docs/architecture/project-overview.md §8）。首次 CI 跑请重点看两处：
#    ① `Setup Haskell` 的 GHC / cabal 版本能否被 runner 装上；
#    ② `Provide wgpu-native lib dir` —— 它补的是本机放在 `cabal.project.local`
#       （.gitignore 忽略、且是绝对路径）里的库目录，CI 上没有这份文件。
#
# 历史（2026-09-17 修）：本工作流曾钉 `ghc-version: 9.4.8`（base-4.17），
# 而 trha.cabal 要求 `base ^>=4.22`（GHC 9.12+）⇒ haskell 与 integration
# 两个 job **不可能通过**。现抬到 ghcup 的 GHC `9.14.1`（latest，base-4.22.0.0）
# 与 cabal `3.14`（trha.cabal 声明 `cabal-version: 3.8`，
# 故 cabal-install 需 ≥3.8）。

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# 同一 ref 只保留最新一次运行：连续 push 时取消上一轮未完成的 run，
# 否则每个 push 都会并行排队、各自把 7 个 job 跑满。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  haskell:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: checkout sov-math (kernel math dependency)
      uses: actions/checkout@v4
      with:
        repository: triqchem-lab/math
        path: .ci/math
        sparse-checkout: |
          hs/sov-math
    
    # runner 镜像已预装 GHC 9.14.1 + cabal 3.16.1.0（install 幂等，2.6 秒），
    # 且 ghcup 用的是 system-wide 的 /usr/local/.ghcup；`~/.ghcup` 在 runner
    # 上不存在 ⇒ 原先那对缓存条目恒为 211 B，纯属摆设。
    - name: Install ghcup-hs + GHC 9.14.1 + cabal 3.16.1.0
      run: |
        curl -sSLo /tmp/ghcup https://github.com/haskell/ghcup-hs/releases/download/v0.2.6.2/x86_64-linux-ghcup-0.2.6.2
        chmod +x /tmp/ghcup
        /tmp/ghcup --version
        /tmp/ghcup install ghc 9.14.1
        /tmp/ghcup install cabal 3.16.1.0
        /tmp/ghcup set ghc 9.14.1
        /tmp/ghcup set cabal 3.16.1.0
        echo "$HOME/.ghcup/bin" >> "$GITHUB_PATH"

    # WebGPU 组件需要 libwgpu_native.so 所在目录参与链接与运行时查找。
    # 本机把它放在 `cabal.project.local`（不入仓、绝对路径），CI 上没有 → 这里生成一份等价配置。
    - name: Provide wgpu-native lib dir
      run: |
        cat > cabal.project.ci.local <<EOF
        package trha
          extra-lib-dirs: $GITHUB_WORKSPACE/3rdparty/wgpu-native/lib
          ghc-options: -optl-Wl,-rpath,$GITHUB_WORKSPACE/3rdparty/wgpu-native/lib
        EOF
        cat cabal.project.ci.local
    
    # cabal-install ≥3.10 按 XDG 布局：包索引在 ~/.cache/cabal/packages，
    # 编译好的依赖在 ~/.local/state/cabal/store。旧写法 ~/.cabal/{packages,store}
    # 在 cabal 3.16 上恒为空 ⇒ 缓存里只有 dist-newstyle，163 个依赖包每次全量重编。
    # 仍列 ~/.cabal 只为兼容自定义 CABAL_DIR；默认不存在，actions/cache 跳过。
    - name: Restore Haskell dependencies
      id: haskell-cache
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.cache/cabal/packages
          ~/.local/state/cabal/store
          ~/.cabal
          dist-newstyle
        key: ${{ runner.os }}-haskell-${{ hashFiles('trha.cabal', 'cabal.project.ci') }}
        restore-keys: |
          ${{ runner.os }}-haskell-
    
    - name: Install dependencies
      run: |
        cabal update --project-file=cabal.project.ci
        cabal build --project-file=cabal.project.ci --only-dependencies
    
    - name: Build
      run: |
        set -o pipefail
        cabal build --project-file=cabal.project.ci all 2>&1 | tee build-output.log
    
    # `cabal test all` 含 `trha-webgpu-test`。该套件在无 GPU / 无 wgpu-native 时
    # 刻意用 `pendingWith` 兜底（见 test-webgpu/Spec.hs 头部注释），所以 runner 无 GPU 也应绿。
    # ⚠️ 那条兜底分支**本机从未走到过**（本机有 GPU），首次 CI 请确认它确实是 pending 而非崩溃。
    - name: Test
      run: |
        set -o pipefail
        cabal test --project-file=cabal.project.ci all 2>&1 | tee test-output.log

    # 测试输出存成 artifact：GitHub 的 /actions/jobs/{id}/logs 会 302 到 Azure
    # Blob，经代理下载常断连（curl: 52 Empty reply from server），拿不到失败
    # 详情。artifact 是可靠的出口，失败时也能下载。
    - name: Upload test output
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-output
        path: '*-output.log'
        if-no-files-found: warn

    - name: Save Haskell dependencies
      if: always() && steps.haskell-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          ~/.cache/cabal/packages
          ~/.local/state/cabal/store
          ~/.cabal
          dist-newstyle
        key: ${{ runner.os }}-haskell-${{ hashFiles('trha.cabal', 'cabal.project.ci') }}
  
  typescript:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js (from .node-version)
      uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
        cache: 'npm'
        # 根的 package-lock.json 只锁了 oxlint，真实依赖在各子包；不列出来，
        # 这个缓存的 key 与实际依赖无关。
        cache-dependency-path: '**/package-lock.json'
    
    - name: Install dependencies
      run: |
        cd packages/scheduler
        npm ci
    
    - name: TypeScript 7 toolchain (tsc 7.0)
      run: |
        cd packages/scheduler
        npx tsc --version
        node -e "const v=require('typescript/package.json').version; if (!v.startsWith('7.0.')) { console.error('expected TypeScript 7.0.x, got ' + v); process.exit(1); }"
        npm run typecheck
    
    - name: Build
      run: |
        cd packages/scheduler
        npm run build

    - name: Build Web (studio assets)
      run: |
        cd packages/app/Web
        npm ci
        npm run build
    
    - name: Test
      run: |
        cd packages/scheduler
        npx vitest run

  # M1 (windows-shell-port-plan): scheduler tests are platform-pure — the win32
  # shell contract (cmd.exe /d /s /c + verbatim quoting) is asserted via injected
  # platform, so this job runs the same suite on a real Windows runner without
  # needing bash.
  # Windows sandbox：AppContainer 隔离的功能性验收。
  # 探针在**沙箱内**跑（spawnAppContainer），断言三件事：写 workspace 成功、
  # 写 C:\Windows 失败、删 workspace 根失败。任一不符即 job 失败（fail-closed）。
  sandbox-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: checkout sov-math (kernel math dependency)
      uses: actions/checkout@v4
      with:
        repository: triqchem-lab/math
        path: .ci/math
        sparse-checkout: |
          hs/sov-math

    - uses: haskell-actions/setup@v2
      with:
        ghc-version: '9.14.1'
        cabal-version: '3.16.1.0'

    # WebGPU 组件需要 libwgpu_native 所在目录参与链接。与 haskell job 同样的做法。
    - name: Provide wgpu-native lib dir
      shell: bash
      run: |
        cat > cabal.project.ci.local <<EOF
        package trha
          extra-lib-dirs: $GITHUB_WORKSPACE/3rdparty/wgpu-native/lib
        EOF

    - name: Build trha-infra
      run: cabal build --project-file=cabal.project.ci trha:trha-infra

    - name: Run AppContainer isolation probes
      shell: bash
      run: |
        WS="$RUNNER_TEMP/trha-probe-ws"
        rm -rf "$WS"; mkdir -p "$WS"
        export TRHA_PROBE_WS="$WS"
        ghc -isrc/infra -outputdir "$RUNNER_TEMP/probe-obj" \
            -optl-luserenv -optl-ladvapi32 \
            -o "$RUNNER_TEMP/acprobe.exe" test/manual/AppContainerIsolation.hs
        "$RUNNER_TEMP/acprobe.exe" | tee "$RUNNER_TEMP/probe.log"
        grep -Eq 'write workspace.*-> 0'  "$RUNNER_TEMP/probe.log"
        grep -Eq 'write C:/Windows.*-> 1' "$RUNNER_TEMP/probe.log"
        grep -Eq 'rmdir workspace.*-> 1'  "$RUNNER_TEMP/probe.log"

  scheduler-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js (from .node-version)
      uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'

    - name: Install dependencies
      run: |
        cd packages/scheduler
        npm ci

    - name: Test
      run: |
        cd packages/scheduler
        npx vitest run

  desktop:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js (from .node-version)
      uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'

    - name: Install dependencies
      run: |
        cd packages/app/Desktop
        npm ci

    - name: Test (host contract, handshake, studio client)
      run: |
        cd packages/app/Desktop
        npx vitest run

    - name: Build main + renderer
      run: |
        cd packages/app/Desktop
        npm run build:main
        npm run build:renderer

  web:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js (from .node-version)
      uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'

    - name: Install dependencies
      run: |
        cd packages/app/Web
        npm ci

    - name: Typecheck
      run: |
        cd packages/app/Web
        npm run typecheck

    - name: Test
      run: |
        cd packages/app/Web
        npm test

    # Web is an independent client (P-10, 2026-10-27): its dist must be
    # reproducible in CI, not only built on a developer machine.
    - name: Build (dist)
      run: |
        cd packages/app/Web
        npm run build

  benchmarks:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js (from .node-version)
      uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'
    
    # benchmarks 的用例直接 import ../../packages/scheduler/src/**（见
    # benchmarks/tests/*.ts），Node 从 packages/scheduler/src 逐级向上找 node_modules：
    # axios 只落在 benchmarks/node_modules，winston/express 则哪儿都没有 ⇒
    # Cannot find package 'axios' / 'winston'。故两处都要装。
    - name: Install dependencies
      run: |
        (cd packages/scheduler && npm ci)
        (cd benchmarks && npm ci)
    
    - name: Run smoke tests
      run: |
        cd benchmarks
        npm test
      env:
        MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
  
  integration:
    needs: [haskell, typescript, benchmarks]
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: checkout sov-math (kernel math dependency)
      uses: actions/checkout@v4
      with:
        repository: triqchem-lab/math
        path: .ci/math
        sparse-checkout: |
          hs/sov-math

    # runner 镜像已预装 GHC 9.14.1 + cabal 3.16.1.0（install 幂等，2.6 秒），
    # 且 ghcup 用的是 system-wide 的 /usr/local/.ghcup；`~/.ghcup` 在 runner
    # 上不存在 ⇒ 原先那对缓存条目恒为 211 B，纯属摆设。
    - name: Install ghcup-hs + GHC 9.14.1 + cabal 3.16.1.0
      run: |
        curl -sSLo /tmp/ghcup https://github.com/haskell/ghcup-hs/releases/download/v0.2.6.2/x86_64-linux-ghcup-0.2.6.2
        chmod +x /tmp/ghcup
        /tmp/ghcup --version
        /tmp/ghcup install ghc 9.14.1
        /tmp/ghcup install cabal 3.16.1.0
        /tmp/ghcup set ghc 9.14.1
        /tmp/ghcup set cabal 3.16.1.0
        echo "$HOME/.ghcup/bin" >> "$GITHUB_PATH"

    - name: Provide wgpu-native lib dir
      run: |
        cat > cabal.project.ci.local <<EOF
        package trha
          extra-lib-dirs: $GITHUB_WORKSPACE/3rdparty/wgpu-native/lib
          ghc-options: -optl-Wl,-rpath,$GITHUB_WORKSPACE/3rdparty/wgpu-native/lib
        EOF

    - name: Restore Haskell dependencies
      id: haskell-cache
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.cache/cabal/packages
          ~/.local/state/cabal/store
          ~/.cabal
          dist-newstyle
        key: ${{ runner.os }}-haskell-${{ hashFiles('trha.cabal', 'cabal.project.ci') }}
        restore-keys: |
          ${{ runner.os }}-haskell-
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'
    
    - name: Build Haskell core
      run: |
        cabal update --project-file=cabal.project.ci
        cabal build --project-file=cabal.project.ci --only-dependencies
        cabal build --project-file=cabal.project.ci all
    
    - name: Build TypeScript scheduler
      run: |
        cd packages/scheduler
        npm ci
        npm run build
    
    - name: Install benchmark dependencies
      run: |
        cd benchmarks
        npm ci

    - name: Run integration tests
      run: |
        cd benchmarks
        npm test -- --grep "Bridge"
      env:
        MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}

    - name: Save Haskell dependencies
      if: always() && steps.haskell-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          ~/.cache/cabal/packages
          ~/.local/state/cabal/store
          ~/.cabal
          dist-newstyle
        key: ${{ runner.os }}-haskell-${{ hashFiles('trha.cabal', 'cabal.project.ci') }}
