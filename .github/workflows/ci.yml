name: CI

# ⚠️ 本工作流**未在本机实跑过**（本机跑的是等价的 shell 命令，回执见
#    docs/architecture/project-overview.md §8）。首次 CI 跑请重点看两处：
#    ① `Setup Haskell` 的 GHC / cabal 版本能否被 runner 装上；
#    ② `Provide wgpu-native lib dir` —— 它补的是本机放在 `cabal.project.local`
#       （.gitignore 忽略、且是绝对路径）里的库目录，CI 上没有这份文件。
#
# 历史（2026-09-17 修）：本工作流曾钉 `ghc-version: 9.4.8`（base-4.17），
# 而 trha.cabal 要求 `base ^>=4.22`（GHC 9.12+）⇒ haskell 与 integration
# 两个 job **不可能通过**。现抬到 ghcup 的 GHC `9.14.1`（latest，base-4.22.0.0）
# 与 cabal `3.14`（trha.cabal 声明 `cabal-version: 3.8`，
# 故 cabal-install 需 ≥3.8）。

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  haskell:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Cache ghcup + cabal store
      uses: actions/cache@v4
      with:
        path: |
          ~/.ghcup
          ~/.cabal/store
        key: ghcup-${{ runner.os }}-9.14.1-3.16.1.0
        restore-keys: ghcup-${{ runner.os }}-

    - name: Install ghcup-hs + GHC 9.14.1 + cabal 3.16.1.0
      run: |
        curl -sSLo /tmp/ghcup https://github.com/haskell/ghcup-hs/releases/download/v0.2.6.2/x86_64-linux-ghcup-0.2.6.2
        chmod +x /tmp/ghcup
        /tmp/ghcup --version
        /tmp/ghcup install ghc 9.14.1
        /tmp/ghcup install cabal 3.16.1.0
        /tmp/ghcup set ghc 9.14.1
        /tmp/ghcup set cabal 3.16.1.0
        echo "$HOME/.ghcup/bin" >> "$GITHUB_PATH"
    
    # WebGPU 组件需要 libwgpu_native.so 所在目录参与链接与运行时查找。
    # 本机把它放在 `cabal.project.local`（不入仓、绝对路径），CI 上没有 → 这里生成一份等价配置。
    - name: Provide wgpu-native lib dir
      run: |
        cat > cabal.project.local <<EOF
        package trha
          extra-lib-dirs: $GITHUB_WORKSPACE/3rdparty/wgpu-native/lib
          ghc-options: -optl-Wl,-rpath,$GITHUB_WORKSPACE/3rdparty/wgpu-native/lib
        EOF
        cat cabal.project.local
    
    - name: Cache Haskell dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cabal/packages
          ~/.cabal/store
          dist-newstyle
        key: ${{ runner.os }}-haskell-${{ hashFiles('trha.cabal') }}
        restore-keys: |
          ${{ runner.os }}-haskell-
    
    - name: Install dependencies
      run: |
        cabal update
        cabal build --only-dependencies
    
    - name: Build
      run: cabal build all
    
    # `cabal test all` 含 `trha-webgpu-test`。该套件在无 GPU / 无 wgpu-native 时
    # 刻意用 `pendingWith` 兜底（见 test-webgpu/Spec.hs 头部注释），所以 runner 无 GPU 也应绿。
    # ⚠️ 那条兜底分支**本机从未走到过**（本机有 GPU），首次 CI 请确认它确实是 pending 而非崩溃。
    - name: Test
      run: cabal test all
  
  typescript:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js (from .node-version)
      uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
        cache: 'npm'
    
    - name: Install dependencies
      run: |
        cd packages/scheduler
        npm install
    
    - name: TypeScript 7 toolchain (tsc 7.0)
      run: |
        cd packages/scheduler
        npx tsc --version
        node -e "const v=require('typescript/package.json').version; if (!v.startsWith('7.0.')) { console.error('expected TypeScript 7.0.x, got ' + v); process.exit(1); }"
        npm run typecheck
    
    - name: Build
      run: |
        cd packages/scheduler
        npm run build

    - name: Build Web (studio assets)
      run: |
        cd packages/app/Web
        npm install
        npm run build
    
    - name: Test
      run: |
        cd packages/scheduler
        npx vitest run

  # M1 (windows-shell-port-plan): scheduler tests are platform-pure — the win32
  # shell contract (cmd.exe /d /s /c + verbatim quoting) is asserted via injected
  # platform, so this job runs the same suite on a real Windows runner without
  # needing bash.
  scheduler-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js (from .node-version)
      uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
        cache: 'npm'

    - name: Install dependencies
      run: |
        cd packages/scheduler
        npm install

    - name: Test
      run: |
        cd packages/scheduler
        npx vitest run

  desktop:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js (from .node-version)
      uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
        cache: 'npm'

    - name: Install dependencies
      run: |
        cd packages/app/Desktop
        npm install

    - name: Test (host contract, handshake, studio client)
      run: |
        cd packages/app/Desktop
        npx vitest run

    - name: Build main + renderer
      run: |
        cd packages/app/Desktop
        npm run build:main
        npm run build:renderer

  web:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js (from .node-version)
      uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
        cache: 'npm'

    - name: Install dependencies
      run: |
        cd packages/app/Web
        npm install

    - name: Typecheck
      run: |
        cd packages/app/Web
        npm run typecheck

    - name: Test
      run: |
        cd packages/app/Web
        npm test

    # Web is an independent client (P-10, 2026-10-27): its dist must be
    # reproducible in CI, not only built on a developer machine.
    - name: Build (dist)
      run: |
        cd packages/app/Web
        npm run build

  benchmarks:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js (from .node-version)
      uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
        cache: 'npm'
    
    - name: Install dependencies
      run: |
        cd benchmarks
        npm install
    
    - name: Run smoke tests
      run: |
        cd benchmarks
        npm test
      env:
        MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
  
  integration:
    needs: [haskell, typescript, benchmarks]
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Cache ghcup + cabal store
      uses: actions/cache@v4
      with:
        path: |
          ~/.ghcup
          ~/.cabal/store
        key: ghcup-${{ runner.os }}-9.14.1-3.16.1.0
        restore-keys: ghcup-${{ runner.os }}-

    - name: Install ghcup-hs + GHC 9.14.1 + cabal 3.16.1.0
      run: |
        curl -sSLo /tmp/ghcup https://github.com/haskell/ghcup-hs/releases/download/v0.2.6.2/x86_64-linux-ghcup-0.2.6.2
        chmod +x /tmp/ghcup
        /tmp/ghcup --version
        /tmp/ghcup install ghc 9.14.1
        /tmp/ghcup install cabal 3.16.1.0
        /tmp/ghcup set ghc 9.14.1
        /tmp/ghcup set cabal 3.16.1.0
        echo "$HOME/.ghcup/bin" >> "$GITHUB_PATH"
    
    - name: Provide wgpu-native lib dir
      run: |
        cat > cabal.project.local <<EOF
        package trha
          extra-lib-dirs: $GITHUB_WORKSPACE/3rdparty/wgpu-native/lib
          ghc-options: -optl-Wl,-rpath,$GITHUB_WORKSPACE/3rdparty/wgpu-native/lib
        EOF
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
        cache: 'npm'
    
    - name: Build Haskell core
      run: |
        cabal update
        cabal build --only-dependencies
        cabal build all
    
    - name: Build TypeScript scheduler
      run: |
        cd packages/scheduler
        npm install
        npm run build
    
    - name: Run integration tests
      run: |
        cd benchmarks
        npm test -- --grep "Bridge"
      env:
        MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
