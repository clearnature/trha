name: Smoke Tests

# ⚠️ 与 ci.yml 同批修（2026-09-17）：haskell-test 与 integration-test 两个 job 原先也钉
#    `ghc-version: 9.4.8`（base-4.17），而 trha.cabal 要求 `base ^>=4.22` ⇒ 不可能通过。
#    现抬到 GHC 9.14.1 + cabal 3.14，并补 wgpu-native 库目录步骤（本机放在被 .gitignore
#    忽略的 cabal.project.local 里，CI 上没有）。**本工作流未在本机实跑过。**

# 本工作流的 Haskell / benchmarks 用例与 ci.yml 的 haskell / benchmarks job
# 完全重叠，不再随每次 push 重复跑：手动触发 + 每日夜间回归
# （UTC 18:00 = 北京时间 02:00）。
on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [26]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'
    
    - name: Install dependencies
      run: |
        (cd packages/scheduler && npm ci)
        (cd benchmarks && npm ci)
    
    # 一次跑完：coverage 与 JSON 报告都由 benchmarks/vitest.config.ts 的
    # coverage / reporters(outputFile) 配置产出；原先 test → coverage → report
    # 三步各起一遍 vitest（三次真实子进程）。
    - name: Run smoke tests (coverage + json report)
      run: |
        cd benchmarks
        npm run test:coverage
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.node-version }}
        path: |
          benchmarks/results/
          benchmarks/coverage/
  
  haskell-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    # 根 cabal.project 的 packages 里有本机绝对路径 /home/yanli/work/math/hs/sov-math，
    # CI 上不存在 ⇒ cabal 直接报 "The package location ... does not exist."。
    # 与 ci.yml 一致：sov-math 单独 checkout 到 .ci/math，所有命令走 cabal.project.ci。
    - name: checkout sov-math (kernel math dependency)
      uses: actions/checkout@v4
      with:
        repository: triqchem-lab/math
        path: .ci/math
        sparse-checkout: |
          hs/sov-math
    
    - name: Cache ghcup + cabal store
      uses: actions/cache@v4
      with:
        path: |
          ~/.ghcup
          ~/.cache/cabal/packages
          ~/.local/state/cabal/store
          ~/.cabal
        key: ghcup-${{ runner.os }}-9.14.1-3.16.1.0
        restore-keys: ghcup-${{ runner.os }}-

    - name: Install ghcup-hs + GHC 9.14.1 + cabal 3.16.1.0
      run: |
        curl -sSLo /tmp/ghcup https://github.com/haskell/ghcup-hs/releases/download/v0.2.6.2/x86_64-linux-ghcup-0.2.6.2
        chmod +x /tmp/ghcup
        /tmp/ghcup --version
        /tmp/ghcup install ghc 9.14.1
        /tmp/ghcup install cabal 3.16.1.0
        /tmp/ghcup set ghc 9.14.1
        /tmp/ghcup set cabal 3.16.1.0
        echo "$HOME/.ghcup/bin" >> "$GITHUB_PATH"

    - name: Provide wgpu-native lib dir
      run: |
        cat > cabal.project.ci.local <<EOF
        package trha
          extra-lib-dirs: $GITHUB_WORKSPACE/3rdparty/wgpu-native/lib
          ghc-options: -optl-Wl,-rpath,$GITHUB_WORKSPACE/3rdparty/wgpu-native/lib
        EOF
    
    - name: Cache Haskell dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/cabal/packages
          ~/.local/state/cabal/store
          ~/.cabal
          dist-newstyle
        # 前缀带 smoke-：与 ci.yml 的 haskell job 若用同一个 actions/cache key，两个
        # workflow 并发 push 会抢同一个 key（Unable to reserve cache）并互相覆盖。
        # 隔开后，同 workflow 内的 integration-test 仍可复用它。
        key: ${{ runner.os }}-smoke-haskell-${{ hashFiles('trha.cabal', 'cabal.project.ci') }}
        restore-keys: |
          ${{ runner.os }}-smoke-haskell-
    
    - name: Install dependencies
      run: |
        cabal update --project-file=cabal.project.ci
        cabal build --project-file=cabal.project.ci --only-dependencies
    
    - name: Build project
      run: cabal build --project-file=cabal.project.ci all
    
    - name: Run Haskell tests
      run: cabal test --project-file=cabal.project.ci all
  
  integration-test:
    needs: [test, haskell-test]
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: checkout sov-math (kernel math dependency)
      uses: actions/checkout@v4
      with:
        repository: triqchem-lab/math
        path: .ci/math
        sparse-checkout: |
          hs/sov-math
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '26'
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'
    
    - name: Cache ghcup + cabal store
      uses: actions/cache@v4
      with:
        path: |
          ~/.ghcup
          ~/.cache/cabal/packages
          ~/.local/state/cabal/store
          ~/.cabal
        key: ghcup-${{ runner.os }}-9.14.1-3.16.1.0
        restore-keys: ghcup-${{ runner.os }}-

    # 只读复用 haskell-test 存下的构建产物（两个 job 串行，不会并发写同一 key）。
    # 没有这一步，integration-test 的 `cabal build all` 要重新全量编译一遍。
    - name: Restore Haskell build cache
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.cache/cabal/packages
          ~/.local/state/cabal/store
          ~/.cabal
          dist-newstyle
        key: ${{ runner.os }}-smoke-haskell-${{ hashFiles('trha.cabal', 'cabal.project.ci') }}
        restore-keys: |
          ${{ runner.os }}-smoke-haskell-

    - name: Install ghcup-hs + GHC 9.14.1 + cabal 3.16.1.0
      run: |
        curl -sSLo /tmp/ghcup https://github.com/haskell/ghcup-hs/releases/download/v0.2.6.2/x86_64-linux-ghcup-0.2.6.2
        chmod +x /tmp/ghcup
        /tmp/ghcup --version
        /tmp/ghcup install ghc 9.14.1
        /tmp/ghcup install cabal 3.16.1.0
        /tmp/ghcup set ghc 9.14.1
        /tmp/ghcup set cabal 3.16.1.0
        echo "$HOME/.ghcup/bin" >> "$GITHUB_PATH"

    - name: Provide wgpu-native lib dir
      run: |
        cat > cabal.project.ci.local <<EOF
        package trha
          extra-lib-dirs: $GITHUB_WORKSPACE/3rdparty/wgpu-native/lib
          ghc-options: -optl-Wl,-rpath,$GITHUB_WORKSPACE/3rdparty/wgpu-native/lib
        EOF
    
    - name: Install Node dependencies
      run: |
        (cd packages/scheduler && npm ci)
        (cd benchmarks && npm ci)
    
    - name: Install Haskell dependencies
      run: |
        cabal update --project-file=cabal.project.ci
        cabal build --project-file=cabal.project.ci --only-dependencies
    
    - name: Build Haskell core
      run: cabal build --project-file=cabal.project.ci all
    
    - name: Build TypeScript scheduler
      run: |
        cd packages/scheduler
        npm run build
    
    - name: Run integration tests
      run: |
        cd benchmarks
        npm test -- -t "Bridge"
    
    - name: Generate integration report
      run: |
        cd benchmarks
        npm run test:report