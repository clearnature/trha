name: sandbox-macos

on:
  push:
    paths:
      - 'src/infra/Infrastructure/Sandbox/**'
      - 'test/Sandbox*.hs'
      - 'test/AuditSpec.hs'
      - 'test/ExperimentSpec.hs'
      - 'test/ConfigSpec.hs'
      - 'test-sandbox/**'
      - 'trha.cabal'
      - 'cabal.project.ci'
      - '.github/workflows/sandbox-macos.yml'
  pull_request:
    paths:
      - 'src/infra/Infrastructure/Sandbox/**'
      - 'test/Sandbox*.hs'
      - 'test-sandbox/**'
      - 'trha.cabal'
      - 'cabal.project.ci'
  workflow_dispatch:

jobs:
  macos:
    # macos-latest (SDK 27) ships .tbd stubs with arm64e.x1 markers that
    # GHC 9.14.1's linker rejects ("tapi error: unknown architecture").
    # Pin the previous SDK generation until GHC catches up.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: checkout sov-math (kernel math dependency)
        uses: actions/checkout@v4
        with:
          repository: triqchem-lab/math
          path: .ci/math
          sparse-checkout: |
            hs/sov-math
      - name: Restore ghcup
        id: ghcup-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ghcup
          key: ghcup-${{ runner.os }}-9.14.1-3.16.1.0
          restore-keys: ghcup-${{ runner.os }}-

      - name: Install ghcup-hs + GHC 9.14.1 + cabal 3.16.1.0
        run: |
          curl -sSLo /tmp/ghcup https://github.com/haskell/ghcup-hs/releases/download/v0.2.6.2/aarch64-apple-darwin-ghcup-0.2.6.2
          chmod +x /tmp/ghcup
          /tmp/ghcup --version
          /tmp/ghcup install ghc 9.14.1
          /tmp/ghcup install cabal 3.16.1.0
          /tmp/ghcup set ghc 9.14.1
          /tmp/ghcup set cabal 3.16.1.0
          echo "$HOME/.ghcup/bin" >> "$GITHUB_PATH"

      # actions/cache 只在 job 成功时保存（post-if: success()）；macOS 测试一旦
      # 失败，GHC 与依赖缓存就永远存不下来（上一轮每次重下 298M）。拆成
      # restore/save 并用 always()，失败也能把缓存留下。
      - name: Save ghcup
        if: always() && steps.ghcup-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.ghcup
          key: ghcup-${{ runner.os }}-9.14.1-3.16.1.0

      - name: Restore Haskell dependencies
        id: haskell-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/cabal/packages
            ~/.local/state/cabal/store
            ~/.cabal
            dist-newstyle
          key: macos-${{ runner.os }}-${{ hashFiles('**/*.cabal', 'cabal.project.ci') }}
          restore-keys: |
            macos-${{ runner.os }}-
      - name: cabal update
        run: cabal update --project-file=cabal.project.ci
      - name: build trha-infra
        run: cabal build --project-file=cabal.project.ci trha-infra
      - name: sandbox tests (Linux-only cases pending on macOS)
        run: cabal test --project-file=cabal.project.ci trha-sandbox-test

      - name: Save Haskell dependencies
        if: always() && steps.haskell-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/cabal/packages
            ~/.local/state/cabal/store
            ~/.cabal
            dist-newstyle
          key: macos-${{ runner.os }}-${{ hashFiles('**/*.cabal', 'cabal.project.ci') }}
