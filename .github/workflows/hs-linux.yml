name: hs-linux

# Haskell 全量构建 + 测试（Ubuntu）。原 ci.yml 的 haskell job 迁出。
# 排查口诀：失败先看 job 名 —— build 挂在依赖/编译，test 挂在用例。

on:
  push:
    paths:
      - 'src/**'
      - 'test/**'
      - 'test-sandbox/**'
      - 'test-webgpu/**'
      - 'packages/app/CLI/**'
      - 'trha.cabal'
      - 'cabal.project.ci'
      - '.github/workflows/hs-linux.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'trha.cabal'
      - 'cabal.project.ci'
      - '.github/workflows/hs-linux.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 静态检查：被遮蔽的重复等式（死代码）。
  # Haskell 多等式按顺序匹配，被前面等式遮挡的定义永远不执行，而编译器默认
  # 不报告（-Woverlapping-patterns 需 -Wall，且只提示「模式重叠」而非「死代码」）。
  # 实例：Commands/Plan.hs 的 go AbandonPlan 曾重复定义，后一条把 "abandon"
  # 写成 "reject"，因被遮蔽而永久不生效。见 docs/plans/import-cleanup-2026-11-05.md。
  check-duplicate-equations:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: 扫描被遮蔽的重复等式
      run: python3 scripts/check-duplicate-equations.py

  hs-linux-build-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    - name: checkout sov-math (kernel math dependency)
      uses: actions/checkout@v4
      with:
        repository: triqchem-lab/math
        path: .ci/math
        sparse-checkout: |
          hs/sov-math

    # 官方 haskell-actions/setup：runner 预装版本优先，缺失走 ghcup。
    # ghc-version 在官方支持列表内（9.14.1）；cabal 用 latest（官方推荐，
    # 写死 '3.16.1.0' 这类补丁号在部分渠道元数据里不存在）。
    - name: Setup Haskell (GHC 9.14.1 + cabal)
      id: setup-haskell
      uses: haskell-actions/setup@v2
      with:
        ghc-version: '9.14.1'
        cabal-version: 'latest'
        # action 的隐式 cabal update 读根目录 cabal.project（../math 不存在），
        # 直接失败；本 workflow 后面有显式 update（走 cabal.project.ci + .ci/math）。
        cabal-update: false

    # WebGPU 组件需要 libwgpu_native.so 所在目录参与链接与运行时查找。
    - name: Provide wgpu-native lib dir
      run: |
        cat > cabal.project.ci.local <<EOF
        package trha
          extra-lib-dirs: $GITHUB_WORKSPACE/3rdparty/wgpu-native/lib
          ghc-options: -optl-Wl,-rpath,$GITHUB_WORKSPACE/3rdparty/wgpu-native/lib
        EOF
        cat cabal.project.ci.local

    # cabal-install ≥3.10 按 XDG 布局；~/.cabal 仅为兼容自定义 CABAL_DIR。
    - name: Restore Haskell dependencies
      id: haskell-cache
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.cache/cabal/packages
          ~/.local/state/cabal/store
          ~/.cabal
          dist-newstyle
        key: ${{ runner.os }}-haskell-${{ hashFiles('trha.cabal', 'cabal.project.ci') }}
        restore-keys: |
          ${{ runner.os }}-haskell-

    - name: Install dependencies
      run: |
        cabal update --project-file=cabal.project.ci
        cabal build --project-file=cabal.project.ci --only-dependencies

    - name: Build
      run: |
        set -o pipefail
        cabal build --project-file=cabal.project.ci all 2>&1 | tee build-output.log

    # trha-webgpu-test 在无 GPU 时用 pendingWith 兜底，runner 上应为 pending 而非崩溃。
    - name: Test
      run: |
        set -o pipefail
        cabal test --project-file=cabal.project.ci all 2>&1 | tee test-output.log

    # job 日志 302 到 Azure Blob（代理常断连），artifact 是可靠出口。
    - name: Upload test output
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: hs-linux-test-output
        path: '*-output.log'
        if-no-files-found: warn

    - name: Save Haskell dependencies
      if: always() && steps.haskell-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          ~/.cache/cabal/packages
          ~/.local/state/cabal/store
          ~/.cabal
          dist-newstyle
        key: ${{ runner.os }}-haskell-${{ hashFiles('trha.cabal', 'cabal.project.ci') }}
