# HLint configuration.
#
# Style-only rules are disabled repo-wide: they fire on pre-existing lines
# and say nothing about correctness. Everything else still outstanding is
# ignored per module, so *new* modules get the full rule set. Burn the list
# down by deleting entries after fixing a module.

# Style-only (repo-wide).
- ignore: {name: 'Eta reduce'}
- ignore: {name: 'Redundant bracket'}
- ignore: {name: 'Use let'}
- ignore: {name: 'Unused LANGUAGE pragma'}
- ignore: {name: 'Avoid lambda'}
- ignore: {name: 'Use fewer imports'}

