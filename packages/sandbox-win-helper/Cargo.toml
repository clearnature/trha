[package]
name = "trha-sandbox-win"
version = "0.1.0"
edition = "2021"
description = "Windows sandbox helper for trha: restricted token + ACL + Job Object over NDJSON v1"
license = "MIT"
publish = false

[[bin]]
name = "trha-sandbox-win"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-targets = "0.52.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
