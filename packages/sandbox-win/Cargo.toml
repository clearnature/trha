[package]
name = "trha-sandbox-win"
version = "0.1.0"
edition = "2021"
description = "Windows sandbox helper — NDJSON v1 protocol over stdio (restricted token + ACL + Job Object)"
license = "UNLICENSED"
publish = false

[[bin]]
name = "trha-sandbox-win"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
