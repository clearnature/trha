# trha production configuration (2026-10-27)
#
# 安全约定：内核与 scheduler 默认只绑 loopback（127.0.0.1），不做公网监听。
# 端口与 token 以 ~/.trha/runtime.json 为运行真相
# （见 docs/contracts/protocol-shell-kernel.md §1.1）。
server:            # scheduler
  host: 127.0.0.1
  port: 28433
  workers: 8
  timeout: 30
  keep_alive: 75

kernel:
  host: 127.0.0.1
  port: 19433

model:
  # 本地三元模型的权重目录；部署时按实际路径覆盖。
  # （旧版的 /opt/trha/models/Qwen3.8-27B-IQ3_M.gguf 已不适用。）
  path: /opt/trha/models
  context_size: 4096
  gpu_layers: 999
  threads: 8
  batch_size: 2048
  ubatch_size: 512
  flash_attn: auto
  engine: cpu        # cpu | webgpu（TRHA_GPU=1 时走 GPU）

logging:
  level: info
  format: json
